<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS DOM 인터랙션</title>
  <link rel="stylesheet" href="style.css">
  <!-- defer: HTML을 모두 읽은 뒤 실행 → querySelector로 요소를 바로 찾을 수 있다 -->
  <script src="script.js" defer></script>
</head>
<body>

  <header class="site-header">
    <h1 class="site-title">JS DOM 인터랙션</h1>
    <p class="site-desc">JavaScript로 DOM을 조작하고 이벤트를 처리하는 미니 기능 모음</p>
  </header>

  <main class="container">

    <!-- 2-1. 버튼 클릭으로 텍스트와 인사 출력 -->
    <section id="greeting" class="card">
      <h2 class="card-title">인사하기</h2>
      <p class="card-desc">이름을 입력하고 버튼을 누르면 인사말이 출력됩니다.</p>

      <div class="field">
        <label for="name-input" class="label">이름</label>
        <div class="field-row">
          <input type="text" id="name-input" class="input" placeholder="예: 홍길동" autocomplete="off">
          <button type="button" id="greet-button" class="button">인사하기</button>
        </div>
      </div>

      <!-- aria-live: 내용이 바뀌면 스크린리더가 읽어 준다 -->
      <div id="greeting-output" class="output" aria-live="polite">
        아직 인사하지 않았어요.
      </div>
    </section>

    <!-- 2-2. 모달 창 구현 -->
    <section id="modal-demo" class="card">
      <h2 class="card-title">모달 창</h2>
      <p class="card-desc">버튼을 누르면 모달이 열리고, 닫기 버튼으로 닫힙니다.</p>
      <button type="button" id="modal-open-button" class="button">모달 열기</button>
    </section>

    <!-- 2-3. 구구단 출력기 -->
    <section id="times-table" class="card">
      <h2 class="card-title">구구단 출력기</h2>
      <p class="card-desc">2~9 사이의 단을 입력하면 구구단을 출력합니다.</p>

      <div class="field">
        <label for="dan-input" class="label">단</label>
        <div class="field-row">
          <input type="number" id="dan-input" class="input" min="2" max="9" step="1" placeholder="예: 7" inputmode="numeric">
          <button type="button" id="times-button" class="button">출력하기</button>
        </div>
      </div>

      <div id="times-output" class="output" aria-live="polite">
        단을 입력하고 버튼을 눌러 주세요.
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <p>Mission 2 · 웹 개발 심화 1</p>
  </footer>

  <!-- 2-2 모달: 기본 숨김 상태 (.modal → display: none, .is-open이 붙으면 표시)
       position: fixed라 화면 전체를 덮으므로 body 끝에 둔다 -->
  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-dialog">
      <div class="modal-header">
        <h2 id="modal-title" class="modal-title">안내</h2>
        <button type="button" class="icon-button" data-modal-close aria-label="모달 닫기">&times;</button>
      </div>
      <p class="modal-body">
        모달 창이 열렸습니다. 닫기 버튼, 바깥 배경 클릭, Esc 키로 닫을 수 있어요.
      </p>
      <div class="modal-footer">
        <button type="button" class="button" data-modal-close>닫기</button>
      </div>
    </div>
  </div>

</body>
</html>
